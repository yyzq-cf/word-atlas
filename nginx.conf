server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # PWA manifest MIME type
    types {
        application/manifest+json webmanifest;
    }

    # gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml font/woff font/woff2;

    # PWA assets — long cache
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|webp|svg|ico|mp3|m4a|wav|webmanifest)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Main JSON data — short cache
    location ~* \.json$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # index.html — no cache
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
